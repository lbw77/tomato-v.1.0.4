<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>JUST TO DO</title>
<style>
  /* ============ 基础变量 ============ */
  :root {
    --focus: #ff7a1a;
    --short: #3a8fff;
    --long: #2ecc71;
    --bg: #0b0b12;
    --bg-2: #11111c;
    --card: rgba(255,255,255,0.035);
    --card-border: var(--w-08);
    --text: #f5f5f7;
    --text-sub: rgba(245,245,247,0.55);
    --accent: var(--focus);
    --radius: 18px;
    --shadow: 0 10px 40px rgba(0,0,0,0.45);
    --ease: cubic-bezier(.22,.61,.36,1);
    /* 表面色（白色透明叠层），浅色主题下由 body.light 覆盖为黑色透明 */
    --w-015: var(--w-015);
    --w-02: var(--w-02);
    --w-03: var(--w-03);
    --w-04: var(--w-04);
    --w-05: var(--w-05);
    --w-06: var(--w-06);
    --w-07: var(--w-07);
    --w-08: var(--w-08);
    --w-10: var(--w-10);
    --w-12: var(--w-12);
    --w-15: var(--w-15);
    --w-16: var(--w-16);
    --w-20: var(--w-20);
    --w-25: var(--w-25);
    /* 主题相关的复合背景 */
    --bg-grad: radial-gradient(1200px 700px at 50% -10%, #1a1a2e 0%, var(--bg) 55%);
    --modal-bg: linear-gradient(160deg, rgba(30,30,44,0.97), rgba(18,18,28,0.97));
    --modal-shadow: 0 24px 80px rgba(0,0,0,0.6), inset 0 1px 0 var(--w-06);
    --mask-bg: rgba(0,0,0,0.6);
  }
  /* ============ 经典白色主题 ============ */
  body.light {
    --bg: #f2f3f8;
    --bg-2: #ffffff;
    --card: rgba(0,0,0,0.03);
    --card-border: rgba(0,0,0,0.1);
    --text: #1b1b28;
    --text-sub: rgba(27,27,40,0.55);
    --shadow: 0 10px 40px rgba(30,30,60,0.12);
    --w-015: rgba(0,0,0,0.015);
    --w-02: rgba(0,0,0,0.025);
    --w-03: rgba(0,0,0,0.035);
    --w-04: rgba(0,0,0,0.045);
    --w-05: rgba(0,0,0,0.05);
    --w-06: rgba(0,0,0,0.06);
    --w-07: rgba(0,0,0,0.08);
    --w-08: rgba(0,0,0,0.09);
    --w-10: rgba(0,0,0,0.1);
    --w-12: rgba(0,0,0,0.14);
    --w-15: rgba(0,0,0,0.16);
    --w-16: rgba(0,0,0,0.18);
    --w-20: rgba(0,0,0,0.22);
    --w-25: rgba(0,0,0,0.28);
    --bg-grad: radial-gradient(1200px 700px at 50% -10%, #ffffff 0%, var(--bg) 55%);
    --modal-bg: linear-gradient(160deg, rgba(255,255,255,0.99), rgba(246,247,251,0.99));
    --modal-shadow: 0 24px 80px rgba(30,30,60,0.22), inset 0 1px 0 rgba(255,255,255,0.7);
    --mask-bg: rgba(20,20,35,0.35);
    --logo-grad: linear-gradient(90deg, #1b1b28 0%, #6a6a84 100%);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg-grad) fixed;
    color: var(--text);
    min-height: 100vh;
    line-height: 1.5;
    overflow-x: hidden;
  }
  button, input, select { font-family: inherit; color: inherit; }
  button { cursor: pointer; border: none; background: none; }
  input, select { background: var(--w-06); border: 1px solid var(--card-border);
                  border-radius: 10px; padding: 10px 12px; color: var(--text); font-size: 15px;
                  outline: none; transition: border-color .2s var(--ease); width: 100%; }
  input:focus, select:focus { border-color: var(--accent); }
  select option { background: var(--bg-2); color: var(--text); }
  select optgroup { background: var(--bg-2); color: var(--text-sub); }

  /* ============ 布局 ============ */
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 18px 60px; }
  header.hero { padding: 56px 0 36px; text-align: center; }
  .logo {
    font-size: clamp(34px, 8vw, 64px);
    font-weight: 800;
    letter-spacing: 2px;
    background: var(--logo-grad, linear-gradient(90deg, #fff 0%, #cfcfe0 100%));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    opacity: 0; transform: translateY(20px);
    animation: heroIn .9s var(--ease) .15s forwards;
  }
  .sub { margin-top: 10px; color: var(--text-sub); font-size: 14px; letter-spacing: 1px;
         opacity: 0; animation: heroIn .9s var(--ease) .35s forwards; }
  .focus-count {
    margin-top: 14px; display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 18px; border-radius: 999px;
    background: rgba(255,165,71,.12); border: 1px solid rgba(255,165,71,.35);
    color: #ffb86b; font-size: 14px; font-weight: 600; letter-spacing: .5px;
    opacity: 0; animation: heroIn .9s var(--ease) .5s forwards;
  }
  .focus-count b { font-size: 18px; color: #ffd089; }
  @keyframes heroIn { to { opacity: 1; transform: translateY(0); } }

  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 18px;
  }
  @media (min-width: 880px) {
    .grid { grid-template-columns: 1.15fr 1fr; }
    .span-2 { grid-column: 1 / -1; }
  }

  /* ============ 卡片 ============ */
  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 22px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: var(--shadow);
    opacity: 0; transform: translateY(24px);
    transition: transform .35s var(--ease), box-shadow .35s var(--ease),
                border-color .35s var(--ease), opacity .6s var(--ease);
  }
  .card.in { opacity: 1; transform: translateY(0); }
  .card:hover { border-color: var(--w-16); transform: translateY(-4px);
                box-shadow: 0 18px 50px rgba(0,0,0,0.55); }
  .card h2 { font-size: 17px; font-weight: 700; margin-bottom: 16px;
             display: flex; align-items: center; gap: 8px; }
  .card h2::before { content: ""; width: 4px; height: 16px; border-radius: 2px; background: var(--accent); }

  /* ============ 番茄钟 ============ */
  .timer-card { display: flex; flex-direction: column; align-items: center; }
  .mode-tabs { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; justify-content: center; }
  .mode-tab {
    padding: 8px 16px; border-radius: 999px; font-size: 14px; color: var(--text-sub);
    border: 1px solid var(--card-border); transition: all .25s var(--ease);
  }
  .mode-tab.active { color: #fff; background: var(--accent); border-color: transparent; }

  .ring-wrap { position: relative; width: min(280px, 72vw); aspect-ratio: 1; }
  .ring-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: var(--w-07); stroke-width: 10; }
  .ring-fg {
    fill: none; stroke: var(--accent); stroke-width: 10; stroke-linecap: round;
    stroke-dasharray: 565.486; stroke-dashoffset: 0;
    transition: stroke .5s var(--ease), stroke-dashoffset .25s linear;
    filter: drop-shadow(0 0 10px var(--accent));
  }
  .ring-center {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 6px;
  }
  .time-display { font-size: clamp(44px, 11vw, 64px); font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 1px; }
  .round-info { font-size: 13px; color: var(--text-sub); }
  .active-todo {
    margin-top: 8px; font-size: 12px; color: var(--accent);
    max-width: 200px; text-align: center; word-break: break-word;
    opacity: 0; transition: opacity .3s var(--ease);
  }
  .active-todo.show { opacity: 1; }

  .controls { display: flex; gap: 12px; margin-top: 26px; flex-wrap: wrap; justify-content: center; }
  .btn {
    padding: 12px 26px; border-radius: 999px; font-size: 15px; font-weight: 600;
    transition: transform .15s var(--ease), opacity .2s var(--ease), background .2s var(--ease);
  }
  .btn:active { transform: scale(0.96); }
  .btn-primary { background: var(--accent); color: #0b0b12; }
  .btn-primary:hover { opacity: .92; }
  .btn-ghost { border: 1px solid var(--card-border); color: var(--text); }
  .btn-ghost:hover { border-color: var(--w-25); }

  /* ============ 设置 ============ */
  .durations { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--text-sub); margin-bottom: 6px; }
  .interval-row { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .interval-row input { max-width: 90px; }

  .presets { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
  .preset {
    padding: 12px; border-radius: 12px; border: 1px solid var(--card-border);
    text-align: center; font-size: 13px; transition: all .2s var(--ease);
    background: var(--w-02);
  }
  .preset:hover { border-color: var(--accent); transform: translateY(-2px); }
  .preset .p-name { font-weight: 600; }
  .preset .p-desc { color: var(--text-sub); margin-top: 2px; font-size: 11px; }

  /* ============ 音频 ============ */
  .audio-modes { display: flex; gap: 8px; margin-bottom: 12px; }
  .audio-mode-btn {
    padding: 6px 14px; border-radius: 20px; font-size: 13px;
    background: var(--w-05); border: 1px solid var(--card-border); color: var(--text-sub);
    transition: all .2s var(--ease);
  }
  .audio-mode-btn:hover { color: var(--text); }
  .audio-mode-btn.active { background: var(--accent); color: #0b0b12; border-color: transparent; }
  .play-modes { display: flex; gap: 8px; margin: 10px 0 14px; }
  .play-mode-btn {
    padding: 6px 16px; border-radius: 20px; font-size: 13px;
    background: var(--w-05); border: 1px solid var(--card-border); color: var(--text-sub);
    transition: all .2s var(--ease);
  }
  .play-mode-btn:hover { color: var(--text); }
  .play-mode-btn.active { background: #22d3ee; color: #0b0b12; border-color: transparent; }
  .audio-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .audio-chip {
    padding: 8px 14px; border-radius: 999px; font-size: 13px;
    border: 1px solid var(--card-border); color: var(--text-sub);
    transition: all .2s var(--ease);
  }
  .audio-chip.active { color: #fff; background: var(--accent); border-color: transparent; }
  .audio-chip:hover { border-color: var(--accent); }
  .audio-row { display: flex; align-items: center; gap: 12px; }
  .audio-row label { font-size: 13px; color: var(--text-sub); white-space: nowrap; }
  .audio-row input[type=range] { flex: 1; accent-color: #22d3ee; }
  .file-btn { display: inline-block; padding: 8px 14px; border-radius: 10px;
              border: 1px dashed var(--card-border); font-size: 13px; color: var(--text-sub);
              cursor: pointer; margin-top: 6px; }
  .file-btn:hover { border-color: var(--accent); color: var(--text); }
  #fileInput { display: none; }

  /* ============ 待办 ============ */
  .todo-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .todo-head h2 { margin-bottom: 0; }
  .todo-toggle {
    width: 32px; height: 32px; border-radius: 50%; font-size: 22px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    background: #22d3ee; color: #0b0b12; font-weight: 700;
    transition: transform .25s var(--ease), background .25s var(--ease);
  }
  .todo-toggle:hover { transform: rotate(90deg) scale(1.08); }
  .todo-toggle.open { transform: rotate(45deg); background: rgba(34,211,238,0.25); color: #22d3ee; }
  .todo-form { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-bottom: 14px;
               animation: slideDown .3s var(--ease); }
  .todo-form[hidden] { display: none; }
  @keyframes slideDown { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
  .todo-form input[type=text] { grid-column: 1 / -1; }
  .todo-form .row { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr 60px auto; gap: 8px; align-items: end; }
  @media (max-width: 520px) {
    .todo-form .row { grid-template-columns: 1fr 1fr; }
    .todo-form .row .add-btn { grid-column: 1 / -1; }
  }
  .add-btn { background: #22d3ee; color: #0b0b12; border-radius: 10px; padding: 10px 16px; font-weight: 600; }

  .todo-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
  .todo-item {
    display: flex; align-items: center; gap: 12px; padding: 12px 14px;
    border-radius: 12px; border: 1px solid var(--card-border);
    background: var(--w-02); transition: all .2s var(--ease);
  }
  .todo-item:hover { border-color: var(--w-20); transform: translateX(3px); }
  .imp-bar { width: 4px; align-self: stretch; border-radius: 2px; flex-shrink: 0; }
  .imp-high { background: #ff4d4f; }
  .imp-medium { background: #faad14; }
  .imp-low { background: #52c41a; }
  .todo-main { flex: 1; min-width: 0; }
  .todo-text { word-break: break-word; font-size: 15px; }
  .todo-meta { font-size: 12px; color: var(--text-sub); margin-top: 3px; }
  .todo-item.done {
    border-color: rgba(245,158,11,0.6);
    background: rgba(245,158,11,0.10);
    box-shadow: 0 0 14px rgba(245,158,11,0.18);
    position: relative;
  }
  .todo-item.done .todo-text { text-decoration: line-through; color: #fbbf24 !important; opacity: .85; }
  .todo-item.done .todo-meta { color: #fcd34d; }
  .todo-item.done .imp-bar { background: #f59e0b; }
  .done-badge {
    position: absolute; top: 8px; right: 8px;
    font-size: 11px; font-weight: 700; letter-spacing: .5px;
    padding: 2px 10px; border-radius: 999px;
    background: linear-gradient(135deg, #f59e0b, #fbbf24);
    color: #3a2a00;
    opacity: 0; transform: scale(.8); transition: all .25s var(--ease);
  }
  .todo-item.done .done-badge { opacity: 1; transform: scale(1); }
  .del-btn { color: var(--text-sub); padding: 6px; border-radius: 8px; font-size: 16px; line-height: 1; }
  .del-btn:hover { color: #ff4d4f; background: rgba(255,77,79,0.1); }

  /* 顶部切换区：页面风格 + 语言 */
  .top-switcher {
    position: fixed; top: 18px; right: 18px; z-index: 100;
    display: flex; gap: 8px; align-items: center;
  }
  .switcher-group {
    display: flex; gap: 4px; padding: 4px; border-radius: 999px;
    background: var(--w-06); border: 1px solid var(--card-border);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  .lang-btn {
    padding: 6px 14px; border-radius: 999px; font-size: 13px;
    color: var(--text-sub); transition: all .2s var(--ease); font-weight: 600;
    white-space: nowrap;
  }
  .lang-btn.active { background: #a78bfa; color: #0b0b12; }
  /* 主题切换：色卡风格（圆角方块 + 主题预览圆点 + 青色描边激活态），区别于专注模式的橙色胶囊 */
  .theme-btn {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 6px 11px; border-radius: 10px; font-size: 12.5px;
    background: var(--w-05); border: 1px solid var(--card-border);
    color: var(--text-sub);
  }
  .theme-btn::before {
    content: ""; width: 10px; height: 10px; border-radius: 50%;
    margin-right: 6px; flex: none;
  }
  .theme-btn[data-theme="dark"]::before {
    background: linear-gradient(135deg, #2b2b3a, #0d0d15);
    border: 1.5px solid rgba(255,255,255,0.75);
  }
  .theme-btn[data-theme="light"]::before {
    background: linear-gradient(135deg, #ffffff, #d9d9e2);
    border: 1.5px solid rgba(0,0,0,0.28);
  }
  .theme-btn:hover { color: var(--text); border-color: var(--w-20); transform: translateY(-1px); }
  .theme-btn.active {
    background: rgba(34,211,238,0.14); border-color: #22d3ee; color: #67e8f9;
    box-shadow: 0 0 0 1px rgba(34,211,238,0.25), 0 4px 14px rgba(34,211,238,0.18);
  }
  body.light .theme-btn.active {
    background: rgba(6,182,212,0.1); border-color: #06b6d4; color: #0e7490;
    box-shadow: 0 0 0 1px rgba(6,182,212,0.2), 0 4px 14px rgba(6,182,212,0.15);
  }

  .todo-time-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .todo-time-row select { max-width: 70px; }
  .todo-time-row input[type=time] { max-width: 110px; }
  .todo-time-row .time-sep { color: var(--text-sub); font-size: 15px; }
  .todo-dates-row { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
  .todo-dates-row > label { font-size: 13px; color: var(--text-sub); }
  .date-picker { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .date-picker select { max-width: 70px; }
  .date-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .date-chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 10px; border-radius: 999px; font-size: 12px;
    background: rgba(34,211,238,0.15); color: #67e8f9; border: 1px solid rgba(34,211,238,0.3);
  }
  .date-chip button {
    background: none; border: none; color: #67e8f9; cursor: pointer; font-size: 14px; line-height: 1; padding: 0;
  }
  .time-tag, .date-tag {
    display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px;
    background: rgba(34,211,238,0.15); color: #67e8f9; margin-right: 6px;
  }
  .time-tag { background: rgba(245,158,11,0.15); color: #fbbf24; }
  .todo-item.off-day { opacity: .55; }
  .todo-item[draggable="true"] { cursor: grab; }
  .todo-item[draggable="true"]:active { cursor: grabbing; }

  /* 日历 */
  .calendar { margin-top: 22px; border-top: 1px solid var(--card-border); padding-top: 18px; }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .cal-title { font-size: 18px; font-weight: 700; }
  .cal-nav { width: 34px; height: 34px; border-radius: 8px; font-size: 20px; line-height: 1;
             color: var(--text); background: var(--w-06); border: 1px solid var(--card-border);
             display: flex; align-items: center; justify-content: center; transition: all .2s var(--ease); }
  .cal-nav:hover { background: var(--accent); color: #0b0b12; }
  .cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 8px; }
  .cal-weekdays div { text-align: center; font-size: 13px; color: var(--text-sub); padding: 6px 0; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .cal-day {
    min-height: 96px; padding: 8px; border-radius: 12px; font-size: 13px;
    background: var(--w-02); border: 1px solid transparent;
    display: flex; flex-direction: column; gap: 4px; transition: all .2s var(--ease);
    cursor: pointer;
  }
  .cal-day:hover:not(.other) { border-color: var(--w-15); background: var(--w-05); }
  .cal-day.other { opacity: .3; cursor: default; }
  .cal-day.today { background: var(--w-08); }
  .cal-day.today .cal-day-num { color: var(--accent); }
  .cal-day.drag-over { background: var(--w-15); transform: scale(1.03); }
  .hour-todos.drag-over { background: rgba(34,211,238,0.12); border-radius: 8px; }
  .cal-day, .cal-nav, .audio-mode-btn, .todo-toggle { outline: none; }
  .cal-day-num { font-weight: 700; font-size: 14px; }
  .cal-chip {
    font-size: 11px; padding: 3px 7px; border-radius: 6px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; background: var(--w-10);
    border-left: 3px solid var(--accent);
  }
  .cal-chip.done { opacity: .5; text-decoration: line-through; }
  .cal-hint { text-align: center; color: var(--text-sub); font-size: 12px; margin-top: 14px; }

  /* ============ 成就栏 ============ */
  .ach-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .ach-head h2 { margin-bottom: 0; }
  .ach-progress {
    font-size: 13px; font-weight: 600; color: var(--text-sub);
    padding: 4px 12px; border-radius: 999px;
    background: var(--w-06); border: 1px solid var(--card-border);
  }
  .ach-grid {
    margin-top: 18px; display: grid; gap: 12px;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  }
  .ach-item {
    position: relative; padding: 16px 14px; border-radius: 14px; text-align: center;
    background: var(--w-03); border: 1px solid var(--card-border);
    transition: transform .2s var(--ease), border-color .2s var(--ease), box-shadow .2s var(--ease);
  }
  .ach-item:hover { transform: translateY(-3px); border-color: var(--w-20); }
  /* 未解锁：整体降透明、图标置灰 */
  .ach-item.locked { opacity: .5; filter: grayscale(1); }
  .ach-item.locked:hover { transform: none; }
  /* 已解锁：高亮描边 + 柔和光晕 */
  .ach-item.unlocked {
    border-color: var(--accent);
    background: linear-gradient(160deg, rgba(255,122,26,.12), var(--w-03));
    box-shadow: 0 6px 24px rgba(255,122,26,.16);
  }
  /* 彩蛋成就：紫色主题，与普通橙色成就区分 */
  .ach-item.egg.unlocked {
    border-color: #a78bfa;
    background: linear-gradient(160deg, rgba(167,139,250,.14), var(--w-03));
    box-shadow: 0 6px 24px rgba(139,92,246,.22);
  }
  .ach-item.egg.unlocked .ach-bar-fill { background: #a78bfa; }
  .ach-icon { font-size: 30px; line-height: 1; }
  .ach-name { margin-top: 8px; font-size: 14px; font-weight: 700; }
  .ach-desc { margin-top: 4px; font-size: 12px; color: var(--text-sub); min-height: 32px; line-height: 1.35; }
  .ach-bar {
    margin-top: 10px; height: 6px; border-radius: 999px; overflow: hidden;
    background: var(--w-08);
  }
  .ach-bar-fill {
    height: 100%; border-radius: 999px; background: var(--accent);
    transition: width .5s var(--ease);
  }
  .ach-item.unlocked .ach-bar-fill { background: var(--accent); }
  .ach-bar-text { margin-top: 5px; font-size: 11px; color: var(--text-sub); font-variant-numeric: tabular-nums; }
  .ach-badge {
    position: absolute; top: 8px; right: 8px; font-size: 12px;
  }
  .ach-empty { text-align: center; color: var(--text-sub); font-size: 13px; padding: 18px 0; }

  /* 成就解锁弹窗 */
  .ach-pop-mask {
    position: fixed; inset: 0; z-index: 400; display: none;
    align-items: center; justify-content: center; padding: 20px;
    background: rgba(0,0,0,0.45); backdrop-filter: blur(4px);
  }
  .ach-pop-mask.show { display: flex; animation: maskIn .25s var(--ease); }
  .ach-pop {
    position: relative; width: 100%; max-width: 320px; padding: 30px 24px 24px;
    text-align: center; border-radius: 22px; overflow: hidden;
    background: var(--modal-bg); border: 1px solid var(--accent);
    box-shadow: 0 20px 70px rgba(0,0,0,0.55), 0 0 40px rgba(255,122,26,0.25);
    animation: achPopIn .5s var(--ease) both;
  }
  @keyframes achPopIn {
    0%   { opacity: 0; transform: scale(.7) translateY(20px); }
    60%  { opacity: 1; transform: scale(1.04) translateY(0); }
    100% { opacity: 1; transform: scale(1); }
  }
  /* 背景放射光晕 */
  .ach-pop-ray {
    position: absolute; top: -60px; left: 50%; width: 220px; height: 220px;
    margin-left: -110px; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, rgba(255,122,26,0.35), transparent 70%);
    animation: achRay 2.4s var(--ease) infinite;
  }
  @keyframes achRay {
    0%, 100% { transform: scale(1); opacity: .7; }
    50%      { transform: scale(1.15); opacity: 1; }
  }
  .ach-pop-icon {
    position: relative; font-size: 54px; line-height: 1;
    animation: achIconPop .6s var(--ease) .1s both;
  }
  @keyframes achIconPop {
    0%   { transform: scale(0) rotate(-30deg); }
    70%  { transform: scale(1.2) rotate(6deg); }
    100% { transform: scale(1) rotate(0); }
  }
  .ach-pop-title {
    position: relative; margin-top: 12px; font-size: 13px; font-weight: 700;
    letter-spacing: 2px; color: var(--accent);
  }
  .ach-pop-name { position: relative; margin-top: 6px; font-size: 21px; font-weight: 800; }
  .ach-pop-desc { position: relative; margin-top: 6px; font-size: 13px; color: var(--text-sub); }
  .ach-pop-btn {
    position: relative; margin-top: 20px; width: 100%;
    padding: 11px; border-radius: 12px; font-size: 15px; font-weight: 700;
    background: var(--accent); color: #0b0b12;
    transition: transform .15s var(--ease), filter .15s var(--ease);
  }
  .ach-pop-btn:hover { transform: translateY(-1px); filter: brightness(1.08); }
  .ach-pop-btn:active { transform: translateY(0) scale(.98); }

  /* 日详情弹窗 */
  .day-modal-mask {
    position: fixed; inset: 0; background: var(--mask-bg); backdrop-filter: blur(6px);
    display: none; align-items: center; justify-content: center; z-index: 200; padding: 16px;
  }
  .day-modal-mask.show { display: flex; animation: maskIn .2s var(--ease); }
  @keyframes maskIn { from { opacity: 0; } to { opacity: 1; } }
  .day-modal {
    background: var(--modal-bg);
    backdrop-filter: blur(20px);
    border: 1px solid var(--w-10); border-radius: 20px;
    width: 100%; max-width: 720px; max-height: 92vh; padding: 22px;
    box-shadow: var(--modal-shadow);
    animation: modalIn .28s var(--ease);
    display: flex; flex-direction: column; overflow: hidden;
  }
  @keyframes modalIn { from { opacity: 0; transform: translateY(14px) scale(.97); } to { opacity: 1; transform: none; } }
  .day-modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; flex-shrink: 0; }
  .day-modal-title { font-size: 20px; font-weight: 700; }
  .day-modal-close {
    width: 32px; height: 32px; border-radius: 8px; font-size: 18px; color: var(--text-sub);
    background: var(--w-06); border: 1px solid var(--card-border); cursor: pointer;
  }
  .day-modal-close:hover { background: rgba(255,77,79,0.15); color: #ff4d4f; }
  /* 时间设置弹窗 */
  #timeSetMask { z-index: 300; }
  .time-set-label { font-size: 12px; color: var(--text-sub); margin-bottom: 6px; }
  .time-set-input {
    width: 100%; padding: 10px 12px; border-radius: 10px; font-size: 16px;
    background: var(--w-05); border: 1px solid var(--card-border); color: var(--text);
    font-family: inherit;
  }
  .time-set-input:focus { outline: none; border-color: var(--primary); }
  .day-modal-list {
    flex: 1; min-height: 0; overflow-y: auto;
    display: flex; flex-direction: column; gap: 10px;
    scrollbar-width: thin; scrollbar-color: var(--w-15) transparent;
  }
  .day-modal-list::-webkit-scrollbar { width: 6px; }
  .day-modal-list::-webkit-scrollbar-thumb { background: var(--w-12); border-radius: 3px; }
  .day-modal-empty { text-align: center; color: var(--text-sub); padding: 20px 0 16px; font-size: 14px; }
  .day-empty-icon { font-size: 34px; margin-bottom: 8px; opacity: .85; }
  .day-empty-hint { font-size: 12px; margin-top: 6px; opacity: .7; }
  .day-slot {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    border-radius: 10px; background: var(--w-03); border: 1px solid var(--card-border);
  }
  .day-slot-time { font-size: 13px; color: var(--text-sub); min-width: 90px; font-weight: 600; }
  .day-slot-text { flex: 1; font-size: 14px; word-break: break-word; }
  .day-slot.done { border-color: rgba(245,158,11,0.5); background: rgba(245,158,11,0.08); }
  .day-slot.done .day-slot-text { color: #fbbf24; text-decoration: line-through; }
  .day-del-btn {
    color: var(--text-sub); padding: 4px 8px; border-radius: 6px; font-size: 15px; line-height: 1;
    background: none; border: none; cursor: pointer; flex-shrink: 0;
  }
  .day-del-btn:hover { color: #ff4d4f; background: rgba(255,77,79,0.12); }

  /* 24 小时时间表（由外层 .day-modal-list 统一滚动，自身不再限高） */
  .day-timetable {
    display: flex; flex-direction: column; gap: 0; position: relative;
    flex-shrink: 0; border-radius: 12px;
    border: 1px solid var(--w-06); background: var(--w-015);
  }
  .hour-row.now { background: rgba(255,122,26,0.05); }
  .hour-row.now .hour-label { color: var(--accent); }
  .now-line {
    position: absolute; left: 60px; right: 6px; height: 2px; z-index: 5;
    background: var(--accent); border-radius: 1px; pointer-events: none;
    box-shadow: 0 0 8px rgba(255,122,26,0.45);
  }
  .now-line::before {
    content: ''; position: absolute; left: -4px; top: -3px;
    width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
  }
  .hour-row {
    display: flex; gap: 10px; height: 56px;
    border-bottom: 1px dashed var(--w-05);
  }
  .hour-row:last-child { border-bottom: none; }
  .hour-label {
    width: 56px; flex-shrink: 0; font-size: 12px; color: var(--text-sub);
    padding-top: 4px; font-weight: 600; text-align: right;
  }
  .hour-todos { flex: 1; position: relative; min-height: 56px; }
  .tt-item {
    display: flex; align-items: center; gap: 8px; padding: 4px 10px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--tc-bg, var(--w-10)), var(--w-04));
    border: 1px solid var(--w-07);
    border-left: 3px solid var(--tc, var(--accent));
    cursor: grab; transition: transform .15s var(--ease), box-shadow .15s var(--ease);
    position: absolute; left: 0; right: 0; z-index: 1;
    box-sizing: border-box; overflow: hidden;
  }
  .tt-item:active { cursor: grabbing; }
  .tt-item:hover { transform: translateX(2px); box-shadow: 0 2px 12px rgba(0,0,0,0.3); }
  .tt-item.done { background: rgba(245,158,11,0.10); border-left-color: #f59e0b; }
  .tt-item.done .tt-text { color: #fbbf24; text-decoration: line-through; opacity: .8; }
  .tt-drag-handle {
    color: var(--text-sub); font-size: 14px; cursor: grab; user-select: none;
    padding: 0 2px; opacity: .5; flex-shrink: 0;
  }
  .tt-item:hover .tt-drag-handle { opacity: 1; color: #22d3ee; }
  .tt-time { font-size: 11px; color: var(--text-sub); min-width: 80px; font-weight: 600; }
  .tt-check { width: 16px; height: 16px; margin: 0; flex-shrink: 0; accent-color: #f59e0b; cursor: pointer; }
  .tt-text { flex: 1; font-size: 13px; word-break: break-word; }
  .tt-del {
    color: var(--text-sub); padding: 3px 8px; border-radius: 5px; font-size: 16px; line-height: 1;
    background: none; border: none; cursor: pointer; flex-shrink: 0;
  }
  .tt-del:hover { color: #ff4d4f; background: rgba(255,77,79,0.12); }
  /* 未设时间区的待办恢复正常流布局 */
  .day-unscheduled-list .tt-item { position: static; height: auto !important; top: auto !important; }
  .day-unscheduled-title {
    margin: 14px 0 8px; font-size: 13px; color: var(--text-sub); font-weight: 600;
    display: flex; align-items: center; gap: 6px;
  }
  .day-add-row {
    display: flex; gap: 8px; margin-top: 14px; padding: 10px;
    background: var(--w-03); border: 1px solid var(--w-07);
    border-radius: 14px; flex-wrap: wrap; align-items: center; flex-shrink: 0;
  }
  .day-add-row input[type=time] { flex: 1; min-width: 90px; }
  .day-add-row input[type=text] { flex: 2; min-width: 120px; }

  footer { text-align: center; color: var(--text-sub); font-size: 12px; padding: 30px 0 10px; }

  /* 通知 */
  .toast {
    position: fixed; left: 50%; top: 24px; transform: translate(-50%, -20px);
    background: var(--accent); color: #0b0b12; padding: 10px 20px; border-radius: 999px;
    font-weight: 600; font-size: 14px; opacity: 0; pointer-events: none;
    transition: all .3s var(--ease); z-index: 500; max-width: 86vw; text-align: center;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  /* 彩蛋提示：回到过去的日期时使用紫色渐变 */
  .toast-nostalgic {
    background: linear-gradient(135deg, #a78bfa, #8b5cf6); color: #fff;
    box-shadow: 0 8px 28px rgba(139,92,246,0.4);
  }

  /* ============ 手机端适配 ============ */
  @media (max-width: 640px) {
    /* 切换按钮组不再悬浮右上角，改为固定在大标题上方 */
    .top-switcher {
      position: static;
      justify-content: center;
      margin: 18px auto 0;
    }
    .hero { padding: 8px 0 30px; }
    .card { padding: 16px; }
    /* toast 不再被悬浮按钮或弹窗遮挡 */
    .toast { top: 12px; font-size: 13px; padding: 9px 14px; }
    /* 日历格更紧凑 */
    .cal-grid { gap: 4px; }
    .cal-day { min-height: 60px; padding: 5px; font-size: 12px; border-radius: 8px; }
    .cal-chip { font-size: 10px; padding: 2px 4px; border-radius: 4px; }
    /* 弹窗与成就卡片收窄 */
    .day-modal { padding: 14px; }
    .day-modal-title { font-size: 17px; }
    .ach-grid { gap: 10px; }
  }
</style>
</head>
<body>
<div class="top-switcher">
  <div class="switcher-group" title="页面风格">
    <button class="lang-btn theme-btn active" data-theme="dark" data-i18n="theme_dark">经典黑色</button>
    <button class="lang-btn theme-btn" data-theme="light" data-i18n="theme_light">经典白色</button>
  </div>
  <div class="switcher-group">
    <button class="lang-btn active" data-lang="zh">中文</button>
    <button class="lang-btn" data-lang="en">EN</button>
  </div>
</div>
<div class="wrap">
  <header class="hero">
    <h1 class="logo">JUST TO DO</h1>
    <p class="sub" data-i18n="hero_sub">专注当下 · 一件一件来</p>
    <div class="focus-count"><span data-i18n="focus_done">已完成</span> <b id="totalFocusCount">0</b> <span data-i18n="focus_times">次专注</span></div>
  </header>

  <div class="grid">
    <!-- 番茄钟 -->
    <section class="card timer-card" data-reveal>
      <div class="mode-tabs">
        <button class="mode-tab active" data-mode="focus" data-i18n="mode_focus">专注</button>
        <button class="mode-tab" data-mode="short" data-i18n="mode_short">短休息</button>
        <button class="mode-tab" data-mode="long" data-i18n="mode_long">长休息</button>
      </div>
      <div class="ring-wrap">
        <svg viewBox="0 0 200 200">
          <circle class="ring-bg" cx="100" cy="100" r="90"></circle>
          <circle class="ring-fg" id="ringFg" cx="100" cy="100" r="90"></circle>
        </svg>
        <div class="ring-center">
          <div class="time-display" id="timeDisplay">25:00</div>
          <div class="round-info" id="roundInfo">第 1 轮 · 0 次专注</div>
          <div class="active-todo" id="activeTodo"></div>
        </div>
      </div>
      <div class="controls">
        <button class="btn btn-primary" id="startBtn" data-i18n="btn_start">开始</button>
        <button class="btn btn-ghost" id="resetBtn" data-i18n="btn_reset">重置</button>
        <button class="btn btn-ghost" id="skipBtn" data-i18n="btn_skip">跳过</button>
        <button class="btn btn-ghost" id="resetRoundBtn" data-i18n="btn_reset_round">重置轮次</button>
      </div>
    </section>

    <!-- 设置 -->
    <section class="card" data-reveal>
      <h2 data-i18n="dur_title">时长设置</h2>
      <div class="durations">
        <div class="field">
          <label data-i18n="dur_focus">专注 (分钟)</label>
          <input type="number" min="1" max="180" id="focusMin" value="25">
        </div>
        <div class="field">
          <label data-i18n="dur_short">短休息 (分钟)</label>
          <input type="number" min="1" max="60" id="shortMin" value="5">
        </div>
        <div class="field">
          <label data-i18n="dur_long">长休息 (分钟)</label>
          <input type="number" min="1" max="60" id="longMin" value="15">
        </div>
      </div>
      <div class="interval-row">
        <label><span data-i18n="dur_interval_pre">每</span> <input type="number" min="1" max="10" id="longInterval" value="4"> <span data-i18n="dur_interval_post">轮专注后长休息</span></label>
      </div>
      <h2 style="margin-top:18px" data-i18n="preset_title">推荐搭配</h2>
      <div class="presets" id="presets"></div>
    </section>

    <!-- 音频 -->
    <section class="card span-2" data-reveal>
      <h2 data-i18n="audio_title">环境音</h2>
      <div class="audio-modes" id="audioModes">
        <button type="button" class="audio-mode-btn active" data-audio-mode="focus" data-i18n="mode_focus">专注</button>
        <button type="button" class="audio-mode-btn" data-audio-mode="short" data-i18n="mode_short">短休息</button>
        <button type="button" class="audio-mode-btn" data-audio-mode="long" data-i18n="mode_long">长休息</button>
      </div>
      <div class="audio-list" id="audioList"></div>
      <div class="play-modes" id="playModes">
        <button type="button" class="play-mode-btn" data-play-mode="loop" data-i18n="play_loop">循环</button>
        <button type="button" class="play-mode-btn" data-play-mode="random" data-i18n="play_random">随机</button>
        <button type="button" class="play-mode-btn" data-play-mode="sequential" data-i18n="play_sequential">顺序</button>
      </div>
      <div class="audio-row">
        <label data-i18n="audio_volume">音量</label>
        <input type="range" id="volume" min="0" max="100" value="50">
        <label class="file-btn" for="fileInput" data-i18n="audio_pick">+ 选择本地音频</label>
        <input type="file" id="fileInput" accept="audio/*" multiple>
      </div>
    </section>

    <!-- 待办 -->
    <section class="card span-2" data-reveal>
      <div class="todo-head">
        <h2 data-i18n="todo_title">待办事项</h2>
        <button type="button" class="todo-toggle open" id="todoToggle" aria-label="toggle">−</button>
      </div>
      <form class="todo-form" id="todoForm">
        <input type="text" id="todoText" maxlength="200" required
               placeholder="写下要做的事..." data-i18n-ph="todo_ph_text">
        <div class="row">
          <div class="field">
            <label data-i18n="todo_duration">时长 (分钟)</label>
            <input type="number" id="todoDuration" min="1" max="600" value="30" style="width:80px">
          </div>
          <div class="field">
            <label data-i18n="todo_imp">重要性</label>
            <select id="todoImp">
              <option value="high" data-i18n="imp_high">高</option>
              <option value="medium" selected data-i18n="imp_medium">中</option>
              <option value="low" data-i18n="imp_low">低</option>
            </select>
          </div>
          <div class="field">
            <label data-i18n="todo_color">颜色</label>
            <input type="color" id="todoColor" value="#f5f5f7" style="padding:4px;height:40px;">
          </div>
          <button type="submit" class="add-btn" data-i18n="todo_add">添加</button>
        </div>
        <div class="todo-dates-row">
          <label data-i18n="todo_dates">安排日期</label>
          <div class="date-picker">
            <select id="dpMonth"></select>
            <select id="dpDay"></select>
          </div>
          <div class="date-chips" id="dateChips"></div>
          <p class="hint" data-i18n="todo_dates_hint">选择月/日自动添加，也可把待办拖到下方日历</p>
        </div>
      </form>
      <ul class="todo-list" id="todoList"></ul>

      <div class="calendar">
        <div class="cal-head">
          <button type="button" class="cal-nav" id="calPrev">‹</button>
          <span class="cal-title" id="calTitle"></span>
          <button type="button" class="cal-nav" id="calNext">›</button>
        </div>
        <div class="cal-weekdays" id="calWeekdays"></div>
        <div class="cal-grid" id="calGrid"></div>
        <p class="cal-hint" data-i18n="cal_hint">将待办拖到日期上即可安排</p>
      </div>
    </section>

    <!-- 成就 -->
    <section class="card span-2" data-reveal>
      <div class="ach-head">
        <h2 data-i18n="ach_title">🏆 成就</h2>
        <span class="ach-progress" id="achProgress"></span>
      </div>
      <div class="ach-grid" id="achGrid"></div>
    </section>
  </div>

  <footer data-i18n="footer">JUST TO DO · 极简番茄钟 · 数据自动保存在本浏览器</footer>
</div>

<div class="day-modal-mask" id="dayModalMask">
  <div class="day-modal" id="dayModal">
    <div class="day-modal-head">
      <div class="day-modal-title" id="dayModalTitle"></div>
      <button type="button" class="day-modal-close" id="dayModalClose" aria-label="close">✕</button>
    </div>
    <div class="day-modal-list" id="dayModalList"></div>
    <div class="day-add-row">
      <input type="number" id="dayAddDur" min="1" max="600" value="30" style="width:80px" data-i18n-ph="day_dur_ph" placeholder="分钟">
      <span class="time-sep" style="color:var(--text-sub)" data-i18n="unit_min">分钟</span>
      <input type="text" id="dayAddText" data-i18n-ph="day_add_ph" placeholder="输入待办...">
      <button type="button" class="add-btn" id="dayAddBtn" data-i18n="btn_add">添加</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- 成就解锁弹窗 -->
<div class="ach-pop-mask" id="achPopMask">
  <div class="ach-pop">

let currentLang = localStorage.getItem('jtd_lang') || 'zh';
function t(key, vars) {
  let s = (I18N[currentLang] && I18N[currentLang][key]) || I18N.zh[key] || key;
  if (vars) for (const k in vars) s = s.replace('{' + k + '}', vars[k]);
  return s;
}
// 页面风格（主题）切换：经典黑色 / 经典白色，持久化到 localStorage
function setTheme(theme) {
  document.body.classList.toggle('light', theme === 'light');
  localStorage.setItem('jtd_theme', theme);
  document.querySelectorAll('.theme-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.theme === theme));
}

function setLang(lang) {
  currentLang = lang;
  localStorage.setItem('jtd_lang', lang);
  document.querySelectorAll('.lang-btn[data-lang]').forEach(b =>
    b.classList.toggle('active', b.dataset.lang === lang));
  applyLang();
  // 动态内容重渲染
  renderPresets();
  renderAudioList();
  renderTodos();
  renderCalendar();
  renderAchievements();
  renderTimer();
}
function applyLang() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = t(el.dataset.i18n);
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => {
    el.placeholder = t(el.dataset.i18nPh);
  });
}

  { id: 'pink-low',    nameZh: '低频粉噪音', nameEn: 'Low Pink Noise', file: 'music/pink/danevaer-low-pink-noise-434732.mp3' },
];
const comboName = (c) => currentLang === 'en' ? c.nameEn : c.nameZh;
const comboDesc = (c) => currentLang === 'en' ? c.descEn : c.descZh;
const trackName = (t) => currentLang === 'en' ? (t.nameEn || t.name) : (t.nameZh || t.name);

/* ============================================================
   状态（运行时）
============================================================ */
const state = {
  // 计时
  mode: 'focus',                  // 'focus' | 'short' | 'long'
  isRunning: false,
  endTime: null,                  // 目标结束时间戳（Date.now 体系）
  remainingMs: 25 * 60 * 1000,    // 暂停/未开始时的剩余时长
  completedFocus: 0,              // 已完成专注轮数（可重置）
  totalFocusCount: 0,             // 累计专注总次数（永不重置）

  // 设置（分钟）
  focusMin: 25,
  shortMin: 5,
  longMin: 15,
  longInterval: 4,

  // 音频（按模式分别设置，每个模式一个播放列表）
  tracksByMode: { focus: [], short: [], long: [] },   // 音轨 id 数组
  playModeByMode: { focus: 'loop', short: 'loop', long: 'loop' }, // loop | sequential | random
  playIndexByMode: { focus: 0, short: 0, long: 0 },   // 当前播放到列表的第几首
  audioEditMode: 'focus',         // 当前正在配置哪个模式的音轨
  volume: 0.5,
  customTracks: [],               // 临时自定义音轨 {id,name,url}

  // 待办
  todos: [],
  activeTodoId: null,        // 当前正在专注的待办 id
  _reminded: new Set(),  // 内存去重：已提醒过的 todoId+日期+时间 组合

  // 成就：已解锁的成就 id 列表（持久化）
  unlockedAchievements: [],
  pastMsgSeen: [],            // 彩蛋成就：已触发过的彩蛋文案 key（集齐三条解锁）

  // 成就统计（持久化）
  totalFocusMinutes: 0,       // 累计专注分钟
  longestFocusMinutes: 0,     // 单次最长专注分钟
  perfectFocusCount: 0,       // 全程未暂停的专注次数
  customFocusCount: 0,        // 使用非默认时长完成的专注次数
  shortBreakCount: 0,         // 完成短休息次数
  longBreakCount: 0,          // 完成长休息次数
  bestStreak: 0,              // 最长连续专注天数
  dayStats: {},               // 按日统计 { 'YYYY-MM-DD': { focus, minutes, hours:[], todosDone } }
  _pausedThisSession: false,  // 运行时：本次专注是否暂停过（不持久化）

  // 日历视图
  calYear: new Date().getFullYear(),
  calMonth: new Date().getMonth(),
};

/* ============================================================
   持久化：事件驱动写盘（不在每秒 tick 里写）
============================================================ */
function saveState() {
  try {
    // 只持久化必要字段，避免体积过大
    const payload = {
      mode: state.mode,
      isRunning: state.isRunning,
      endTime: state.endTime,
      remainingMs: state.remainingMs,
      completedFocus: state.completedFocus,
      totalFocusCount: state.totalFocusCount,
      focusMin: state.focusMin,
      shortMin: state.shortMin,
      longMin: state.longMin,
      longInterval: state.longInterval,
    tracksByMode: state.tracksByMode,
    playModeByMode: state.playModeByMode,
    volume: state.volume,
      todos: state.todos,
      unlockedAchievements: state.unlockedAchievements,
      pastMsgSeen: state.pastMsgSeen,
      totalFocusMinutes: state.totalFocusMinutes,
      longestFocusMinutes: state.longestFocusMinutes,
      perfectFocusCount: state.perfectFocusCount,
      customFocusCount: state.customFocusCount,
      shortBreakCount: state.shortBreakCount,
      longBreakCount: state.longBreakCount,
      bestStreak: state.bestStreak,
      dayStats: state.dayStats,
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
  } catch (e) { /* 忽略存储错误 */ }
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const s = JSON.parse(raw);
    Object.assign(state, s);

    // 防御：旧数据可能缺少字段或类型不对，补默认值，避免轮次/时长显示异常
    if (typeof state.completedFocus !== 'number' || isNaN(state.completedFocus)) state.completedFocus = 0;
    if (typeof state.totalFocusCount !== 'number' || isNaN(state.totalFocusCount)) state.totalFocusCount = 0;
    if (typeof state.longInterval !== 'number' || !state.longInterval) state.longInterval = 4;
    ['focusMin','shortMin','longMin'].forEach(k => {
      if (typeof state[k] !== 'number' || !state[k]) state[k] = k==='focusMin'?25:k==='shortMin'?5:15;
    });
    ['tracksByMode', 'playModeByMode'].forEach(k => {
      if (!state[k] || typeof state[k] !== 'object') state[k] = { focus: null, short: null, long: null };
      ['focus','short','long'].forEach(m => {
        if (k === 'tracksByMode' && !Array.isArray(state[k][m])) state[k][m] = [];
        if (k === 'playModeByMode' && !['loop','sequential','random'].includes(state[k][m])) state[k][m] = 'loop';
      });
    });
    if (!state.playIndexByMode || typeof state.playIndexByMode !== 'object') {
      state.playIndexByMode = { focus: 0, short: 0, long: 0 };
    }
    // 兼容旧数据：旧版单个 trackByMode → 转成列表
    if (s.trackByMode) {
      ['focus','short','long'].forEach(m => {
        if (s.trackByMode[m] && state.tracksByMode[m].length === 0) state.tracksByMode[m] = [s.trackByMode[m]];
      });
    }
    if (s.currentTrackId && state.tracksByMode.focus.length === 0) state.tracksByMode.focus = [s.currentTrackId];
    if (!Array.isArray(state.todos)) state.todos = [];
    if (!Array.isArray(state.unlockedAchievements)) state.unlockedAchievements = [];
    if (!Array.isArray(state.pastMsgSeen)) state.pastMsgSeen = [];
    // 成就统计字段防御：类型不对时补默认值
    ['totalFocusMinutes','longestFocusMinutes','perfectFocusCount','customFocusCount','shortBreakCount','longBreakCount','bestStreak']
      .forEach(k => { if (typeof state[k] !== 'number' || isNaN(state[k])) state[k] = 0; });
    if (!state.dayStats || typeof state.dayStats !== 'object' || Array.isArray(state.dayStats)) state.dayStats = {};
    // 兼容旧数据：旧版用单个 date 字段，迁移到 dates 数组
    state.todos.forEach(t => {
      if (!Array.isArray(t.dates)) {
        t.dates = t.date ? [t.date] : [];
        delete t.date;
      }
      // 兼容旧数据：旧版单个 startTime 字段，迁移到 slots 时间段数组
      if (!Array.isArray(t.slots)) {
        t.slots = t.startTime ? [{ start: t.startTime, dur: t.duration || 30 }] : [];
      }
      delete t.startTime;
    });

    // 若刷新时正在计时，校准剩余时间
    if (state.isRunning && state.endTime) {
      const rem = state.endTime - Date.now();
      if (rem <= 0) {
        // 计时已在后台结束
        state.isRunning = false;
        state.remainingMs = 0;
        // 触发完成（延后到主循环）
        setTimeout(() => completeSession(true), 0);
      } else {
        state.remainingMs = rem;
      }
    }
  } catch (e) { /* 忽略解析错误 */ }
}

/* ============================================================
   工具函数
============================================================ */
const $ = (s) => document.querySelector(s);
const fmt = (ms) => {
  const s = Math.max(0, Math.ceil(ms / 1000));
  const m = Math.floor(s / 60);
  const r = s % 60;
  return `${String(m).padStart(2, '0')}:${String(r).padStart(2, '0')}`;
};
const modeDuration = () => {
  const m = state.mode === 'focus' ? state.focusMin
          : state.mode === 'short' ? state.shortMin
          : state.longMin;
  return m * 60 * 1000;
};
const modeColor = () => state.mode === 'focus' ? 'var(--focus)'
                      : state.mode === 'short' ? 'var(--short)' : 'var(--long)';

function toast(msg, extraCls) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.remove('toast-nostalgic');
  if (extraCls) el.classList.add(extraCls);
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 1800);
}

/* ============================================================
   渲染
============================================================ */
function applyModeColor() {
  document.documentElement.style.setProperty('--accent', modeColor());
}

function renderModeTabs() {
  document.querySelectorAll('.mode-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.mode === state.mode);
  });
}

function renderTimer() {
  const total = modeDuration();
  const rem = state.isRunning ? (state.endTime - Date.now()) : state.remainingMs;
  const clamped = Math.max(0, rem);
  $('#timeDisplay').textContent = fmt(clamped);

  const progress = total > 0 ? clamped / total : 0;
  $('#ringFg').style.strokeDashoffset = CIRC * (1 - progress);

  // 当前轮次：专注中=已完成数+1；休息中=刚完成的轮次；手动切到休息且未完成过时至少为 1
  const round = Math.max(1, state.completedFocus + (state.mode === 'focus' ? 1 : 0));
  $('#roundInfo').textContent = t('round_info', { round, n: state.completedFocus });
  $('#totalFocusCount').textContent = state.totalFocusCount || 0;

  // 当前正在专注的待办
  const atEl = $('#activeTodo');
  const activeTodo = state.todos.find(t => t.id === state.activeTodoId);
  if (activeTodo && !activeTodo.done) {
    atEl.textContent = '🎯 ' + activeTodo.text;
    atEl.classList.add('show');
  } else {
    atEl.textContent = '';
    atEl.classList.remove('show');
  }
}

function renderSettings() {
  $('#focusMin').value = state.focusMin;
  $('#shortMin').value = state.shortMin;
  $('#longMin').value = state.longMin;
  $('#longInterval').value = state.longInterval;
}

function renderPresets() {
  const box = $('#presets');
  box.innerHTML = COMBOS.map(c => `
    <button class="preset" data-combo="${c.key}">
      <div class="p-name">${comboName(c)}</div>

    </button>
  `).join('');
}

function renderAudioList() {
  const box = $('#audioList');
  const tracks = [...AUDIO_TRACKS, ...state.customTracks];
  const activeIds = state.tracksByMode[state.audioEditMode] || [];
  box.innerHTML = tracks.map(t => `
    <button class="audio-chip ${activeIds.includes(t.id) ? 'active' : ''}"
            data-track="${t.id}">${trackName(t)}</button>
  `).join('');

  // 同步模式按钮高亮
  document.querySelectorAll('.audio-mode-btn').forEach(b => {

  // 同步播放模式按钮高亮

  document.querySelectorAll('.play-mode-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.playMode === pm);
  });
}

function renderTodos() {
  const list = $('#todoList');
  if (state.todos.length === 0) {
    list.innerHTML = `<li style="text-align:center;color:var(--text-sub);padding:20px;font-size:14px">${t('todo_empty')}</li>`;
    return;
  }
  const today = todayStr();
  list.innerHTML = state.todos.map(todo => {
    const color = todo.color || '#f5f5f7';
    const done = !!todo.done;
    const datesList = (todo.dates || []).slice().sort();
    const datesLabel = datesList.length ? `<span class="date-tag">📅 ${datesList.join(', ')}</span>` : '';
    const dur = todo.duration || 30;
    const durLabel = `<span class="time-tag">⏱ ${dur}${t('unit_min')}</span>`;
    return `
      <li class="todo-item ${done ? 'done' : ''}" data-id="${todo.id}" draggable="true">
        <span class="done-badge" data-i18n="day_done">已完成</span>
        <span class="imp-bar imp-${todo.importance}"></span>
        <input type="checkbox" ${done ? 'checked disabled' : ''} data-act="toggle" style="width:auto;accent-color:var(--accent)">
        <div class="todo-main">
          <div class="todo-text" style="color:${color}">${escapeHtml(todo.text)}</div>
          <div class="todo-meta">${durLabel}${datesLabel} · ${impText(todo.importance)}</div>
        </div>
        <button class="del-btn" data-act="del" aria-label="删除">✕</button>
      </li>`;
  }).join('');
}
const impText = (i) => i === 'high' ? t('imp_high_text') : i === 'low' ? t('imp_low_text') : t('imp_medium_text');
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// 表单中临时选择的日期
let formDates = [];
function initDatePicker() {
  const m = $('#dpMonth'), d = $('#dpDay');
  if (!m || !d) return;
  for (let i = 1; i <= 12; i++) m.insertAdjacentHTML('beforeend', `<option value="${String(i).padStart(2,'0')}">${i}</option>`);
  for (let i = 1; i <= 31; i++) d.insertAdjacentHTML('beforeend', `<option value="${String(i).padStart(2,'0')}">${i}</option>`);
  const now = new Date();
  m.value = String(now.getMonth()+1).padStart(2,'0');
  d.value = String(now.getDate()).padStart(2,'0');
  // 选择月/日后自动添加到日期列表
  const autoAdd = () => addFormDate();
  m.addEventListener('change', autoAdd);
  d.addEventListener('change', autoAdd);
}
function renderDateChips() {
  const box = $('#dateChips');
  if (!box) return;
  box.innerHTML = formDates.slice().sort().map(dt =>
    `<span class="date-chip">${dt}<button type="button" data-rm-date="${dt}" aria-label="remove">✕</button></span>`
  ).join('');
}
function addFormDate() {

  if (!m || !d) return;

  if (!formDates.includes(dt)) {
    formDates.push(dt);
    renderDateChips();

// 时间值格式："13:45~14:45"，直接显示
function formatTodoTime(v) {
  if (!v) return t('todo_no_time');
  return v;
}
// 返回 todo 关联的所有日期 MM-DD 数组
function todoDates(t) {
  return t.dates || [];
}
function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}

function renderAll() {
  applyModeColor();
  renderModeTabs();
  renderTimer();
}

/* ============================================================
   计时核心：目标时间戳 + visibilitychange 修正
============================================================ */
let tickTimer = null;

function startTick() {
  if (tickTimer) return;
  tickTimer = setInterval(tick, 200);
}
function stopTick() {
  clearInterval(tickTimer);
  tickTimer = null;
}

function tick() {
  if (!state.isRunning) { renderTimer(); return; }
  const rem = state.endTime - Date.now();
  if (rem <= 0) {
    completeSession(false);
    return;
  }
  renderTimer();
}

function start() {
  if (state.isRunning) return;
  if (state.remainingMs <= 0) state.remainingMs = modeDuration();
  state.endTime = Date.now() + state.remainingMs;
  state.isRunning = true;
  $('#startBtn').textContent = t('btn_pause');
  startTick();
  saveState();
  // 播放当前模式对应的环境音列表
  playModePlaylist(state.mode);
}

function pause() {
  if (!state.isRunning) return;
  // 成就统计：专注阶段只要暂停过，则本次不计入「一气呵成」
  if (state.mode === 'focus') state._pausedThisSession = true;
  state.remainingMs = state.endTime - Date.now();
  state.isRunning = false;
  state.endTime = null;
  $('#startBtn').textContent = t('btn_resume');
  stopTick();
  saveState();
  pauseAudio();
}

function reset() {
  state.isRunning = false;
  state.endTime = null;
  state.remainingMs = modeDuration();
  state.activeTodoId = null;
  state._pausedThisSession = false; // 重置暂停标记
  $('#startBtn').textContent = t('btn_start');
  stopTick();
  renderTimer();
  saveState();
  pauseAudio();
}

function completeSession(fromReload) {
  state.isRunning = false;
  state.endTime = null;
  state.remainingMs = 0;
  stopTick();
  pauseAudio();

  // 提示音（用 Web Audio 生成，不依赖音频文件）
  beep();

  if (state.mode === 'focus') {
    state.completedFocus += 1;
    state.totalFocusCount += 1;
    // 成就统计：累计时长 / 单次最长 / 未暂停次数 / 自定义时长 / 按日记录
    const mins = state.focusMin || 25;
    state.totalFocusMinutes += mins;
    if (mins > (state.longestFocusMinutes || 0)) state.longestFocusMinutes = mins;
    if (!state._pausedThisSession) state.perfectFocusCount += 1;
    if (mins !== 25) state.customFocusCount += 1;
    recordFocusCompletion(mins);
    // 判断是否长休息
    const shouldLong = state.completedFocus % state.longInterval === 0;
    state.mode = shouldLong ? 'long' : 'short';
    toast(shouldLong ? t('toast_focus_done_long') : t('toast_focus_done_short'));
  } else {
    // 成就统计：累计完成的休息次数
    if (state.mode === 'short') state.shortBreakCount += 1;
    else state.longBreakCount += 1;
    state.mode = 'focus';
    toast(t('toast_break_done'));
  }
  state._pausedThisSession = false; // 为新阶段重置暂停标记
  checkAchievements();

  state.remainingMs = modeDuration();
  $('#startBtn').textContent = t('btn_start');
  applyModeColor();
  renderModeTabs();
  renderTimer();
  saveState();

  // 自动开始下一阶段（短延迟让提示音和提示被感知）
  setTimeout(() => { start(); }, 800);
}

function skip() {
  // 直接跳到下一阶段，不计入完成
  if (state.mode === 'focus') {
    state.mode = (state.completedFocus + 1) % state.longInterval === 0 ? 'long' : 'short';
  } else {
    state.mode = 'focus';
  }
  state.isRunning = false;
  state.endTime = null;
  state.remainingMs = modeDuration();
  state._pausedThisSession = false; // 重置暂停标记
  $('#startBtn').textContent = t('btn_start');
  applyModeColor();
  renderModeTabs();
  renderTimer();
  saveState();
}

function resetRound() {
  // 重置已完成专注次数（轮次清零），不影响当前计时
  state.completedFocus = 0;
  renderTimer();
  saveState();
  toast(t('toast_round_reset'));
}

// 标签页可见性变化：重新基于 endTime 计算，避免休眠累积误差
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) {
    if (state.isRunning) {
      const rem = state.endTime - Date.now();
      if (rem <= 0) {
        completeSession(false);
      } else {
        renderTimer();
        startTick(); // 确保 tick 在运行
      }
    } else {
      renderTimer();
    }
  }
});

/* ============================================================
   提示音（Web Audio 合成，无需文件）
============================================================ */
let audioCtx = null;
function beep() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const ctx = audioCtx;
    const now = ctx.currentTime;
    [880, 1108, 1318].forEach((f, i) => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'sine';
      o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, now + i * 0.18);
      g.gain.exponentialRampToValueAtTime(0.25, now + i * 0.18 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.18 + 0.16);
      o.connect(g).connect(ctx.destination);
      o.start(now + i * 0.18);
      o.stop(now + i * 0.18 + 0.18);
    });
  } catch (e) {}
}

/* ============================================================
   音频播放（环境音）
============================================================ */
let audioEl = null;
function getAudioEl() {
  if (!audioEl) {
    audioEl = new Audio();
    audioEl.volume = state.volume;
    // 一首播完时，根据当前模式的播放模式决定下一首
    audioEl.addEventListener('ended', () => {
      const mode = state.mode;
      const pm = state.playModeByMode[mode] || 'loop';
      if (pm === 'loop') return; // loop=true 已自动重播
      const list = state.tracksByMode[mode] || [];
      if (list.length === 0) return;
      if (pm === 'sequential') {
        state.playIndexByMode[mode] = (state.playIndexByMode[mode] + 1) % list.length;
      } else if (pm === 'random') {
        let n;
        do { n = Math.floor(Math.random() * list.length); }
        while (list.length > 1 && n === state.playIndexByMode[mode]);
        state.playIndexByMode[mode] = n;
      }
      saveState();
      playModePlaylist(mode);
    });
  }
  return audioEl;
}

function resolveTrack(id) {
  return AUDIO_TRACKS.find(t => t.id === id)
      || state.customTracks.find(t => t.id === id);
}

function pauseAudio() {
  if (audioEl) audioEl.pause();
}

function toggleTrack(id) {
  // 多选：加入/移除当前模式的播放列表
  const mode = state.audioEditMode;
  const list = state.tracksByMode[mode];
  const idx = list.indexOf(id);
  if (idx >= 0) list.splice(idx, 1);
  else list.push(id);
  state.playIndexByMode[mode] = 0;
  saveState();
  renderAudioList();
  // 若倒计时正在运行且与当前编辑模式一致，立即重新加载该模式的播放列表
  if (state.isRunning && state.mode === mode) {
    if (list.length) playModePlaylist(mode);
    else pauseAudio();
  }
}

// 按模式播放播放列表（根据 playModeByMode 决定单曲/顺序/随机）
function playModePlaylist(mode) {
  const list = state.tracksByMode[mode] || [];
  if (list.length === 0) { pauseAudio(); return; }
  const pm = state.playModeByMode[mode] || 'loop';
  const el = getAudioEl();
  el.loop = (pm === 'loop');
  const idx = state.playIndexByMode[mode] % list.length;
  const id = list[idx];
  const track = resolveTrack(id);
  if (!track) { pauseAudio(); return; }
  if (el.dataset.trackId !== id) {
    el.src = track.file || track.url;
    el.dataset.trackId = id;
  }
  el.volume = state.volume;
  const p = el.play();
  if (p && p.catch) p.catch(() => {});
}

function addTodo(text, duration, importance, color, dates) {

function toggleTodo(id) {

/* ============================================================
   待办开始前 10 分钟提醒
============================================================ */
// 取待办的时间段列表 [{start, dur}]，兼容旧字段 startTime / time("HH:MM~HH:MM")
function parseTodoSlots(t) {
  if (Array.isArray(t.slots) && t.slots.length) return t.slots;
  if (t.startTime) return [{ start: t.startTime, dur: t.duration || 30 }];
  if (t.time) {
    const m = /(\d{2}:\d{2})/.exec(t.time);
    if (m) return [{ start: m[1], dur: t.duration || 30 }];
  }
  return [];
}

function checkReminders() {
  const now = new Date();
  const todayStr2 = `${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  for (const t of state.todos) {
    if (t.done) continue;
    const slots = parseTodoSlots(t);
    if (!slots.length) continue;
    // 若任务关联了日期，仅在今天匹配时提醒；无日期则视为今天
    const dates = t.dates || [];
    if (dates.length && !dates.includes(todayStr2)) continue;
    for (const s of slots) {
      const [h, m] = s.start.split(':').map(Number);
      const target = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m, 0, 0);
      const diffMs = target - now;

      // 1) 开始前 10 分钟内 → 桌面系统通知 + 提示音
      if (diffMs <= 10 * 60 * 1000 && diffMs > 0) {
        const key = `${t.id}_${todayStr2}_${s.start}`;
        if (state._reminded.has(key)) continue;
        state._reminded.add(key);
        fireReminder(t, s.start);
      }
      // 2) 开始时间已到（30 分钟内）→ 弹窗提醒，询问是否开始专注倒计时
      else if (diffMs <= 0 && diffMs > -30 * 60 * 1000) {
        const key = `start_${t.id}_${todayStr2}_${s.start}`;
        if (state._reminded.has(key)) continue;
        state._reminded.add(key);
        showStartReminder(t, s.start);
      }
    }
  }
}

// 开始前 10 分钟 → 桌面系统通知 + 提示音（不弹页面窗口）
function fireReminder(todo, startTime) {
  const msg = t('reminder_msg', { text: todo.text, time: startTime });
  let notified = false;
  if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
    try {
      new Notification(t('reminder_title'), { body: msg, tag: `todo-remind-${todo.id}` });
      notified = true;
    } catch (e) { notified = false; }
  }
  beep();
  // 兜底：没有桌面通知权限时，用页面提示条，避免提醒丢失
  if (!notified) toast(msg);
}

// 当前弹窗对应的待办（供「开始专注倒计时」按钮读取）
let pendingReminderTodo = null;

// 待办开始时间到 → 弹窗提醒，询问是否开始专注倒计时
function showStartReminder(todo, start) {
  pendingReminderTodo = todo;
  start = start || '';
  const dur = todo.duration || 30;
  $('#reminderTitle').textContent = '⏰ ' + t('reminder_title');
  $('#reminderBody').textContent = t('reminder_body', { text: todo.text, start, dur });
  $('#reminderMask').classList.add('show');
  beep();
  if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
    new Notification(t('reminder_title'), {
      body: t('reminder_body', { text: todo.text, start, dur })
    });
  }
}

// 请求通知权限（在用户首次交互时调用）
function askNotificationPermission() {
  if (typeof Notification === 'undefined') return;
  if (Notification.permission === 'default') {
    Notification.requestPermission().catch(() => {});
  }
}

/* ============================================================
   日历
============================================================ */
function renderCalendar() {
  const year = state.calYear, month = state.calMonth;
  $('#calTitle').textContent = `${year} - ${String(month + 1).padStart(2, '0')}`;
  const wdNames = I18N[currentLang].weekdays;
  $('#calWeekdays').innerHTML = wdNames.map(n => `<div>${n}</div>`).join('');

  const firstDay = new Date(year, month, 1).getDay(); // 0=Sun..6=Sat
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const prevDays = new Date(year, month, 0).getDate();
  const today = new Date();
  const todayStr2 = `${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;

  // 从周一开始排列（ourDay 1=Mon..7=Sun）
  const startOffset = (firstDay + 6) % 7;
  const cells = [];
  // 上月尾
  for (let i = startOffset - 1; i >= 0; i--) {
    cells.push({ day: prevDays - i, other: true, date: null });
  }
  // 本月
  for (let d = 1; d <= daysInMonth; d++) {
    const mm = String(month + 1).padStart(2, '0');
    const dd = String(d).padStart(2, '0');
    cells.push({ day: d, other: false, date: `${mm}-${dd}` });
  }
  // 下月头补齐到 42 格（6 行）
  let nextD = 1;
  while (cells.length < 42) {
    cells.push({ day: nextD++, other: true, date: null });
  }

  $('#calGrid').innerHTML = cells.map(c => {
    if (c.other) return `<div class="cal-day other"><span class="cal-day-num">${c.day}</span></div>`;
    const dayTodos = state.todos.filter(t => (t.dates || []).includes(c.date));
    const isToday = c.date === todayStr2;
    const chips = dayTodos.slice(0, 3).map(t =>
      `<div class="cal-chip ${t.done ? 'done' : ''}" style="color:${t.color || '#fff'};border-left-color:${t.color || 'var(--accent)'}">${escapeHtml(t.text)}</div>`
    ).join('');
    const more = dayTodos.length > 3 ? `<div class="cal-chip" style="opacity:.6">+${dayTodos.length - 3}</div>` : '';
    return `<div class="cal-day ${isToday ? 'today' : ''}" data-date="${c.date}">
      <span class="cal-day-num">${c.day}</span>${chips}${more}
    </div>`;
  }).join('');
}

function calPrev() {
  state.calMonth--;
  if (state.calMonth < 0) { state.calMonth = 11; state.calYear--; }
  renderCalendar();
}
function calNext() {
  state.calMonth++;
  if (state.calMonth > 11) { state.calMonth = 0; state.calYear++; }
  renderCalendar();
}

/* ============ 日详情弹窗 ============ */
let currentDayDate = null; // 当前打开的日期 MM-DD
function openDayModal(dateStr) {

  const [m, d] = dateStr.split('-');
  $('#dayModalTitle').textContent = `${state.calYear}-${m}-${d}`;
  renderDayModal();
  $('#dayModalMask').classList.add('show');
  $('#dayAddText').value = '';
  $('#dayAddDur').value = '30';
}
function closeDayModal() {

  currentDayDate = null;
}
// 根据开始时间 "HH:MM" + 时长(分钟) 计算结束时间 "HH:MM"
function addMinutes(timeStr, mins) {
  if (!timeStr) return '';
  const [h, m] = timeStr.split(':').map(Number);
  let total = h * 60 + m + mins;
  total = ((total % 1440) + 1440) % 1440;
  return `${String(Math.floor(total / 60)).padStart(2, '0')}:${String(total % 60).padStart(2, '0')}`;
}
function renderDayModal() {
  if (!currentDayDate) return;
  const dayTodos = state.todos.filter(t => (t.dates || []).includes(currentDayDate));
  const list = $('#dayModalList');

  const PX_PER_MIN = 56 / 60; // 每行 56px

  // 是否今天：用于高亮当前小时 + 当前时间指示线
  const now = new Date();
  const todayStr = `${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  const isToday = currentDayDate === todayStr;

  // 24 小时时间表（始终显示，方便拖入待办）
  let html = '';
  if (dayTodos.length === 0) {
    html += `<div class="day-modal-empty"><div class="day-empty-icon">🗓️</div><div>${t('day_empty')}</div><div class="day-empty-hint">${t('day_drag_hint')}</div></div>`;
  }

  // 当日全部待办作为「拖拽源」：拖到小时格安排时间段，源不消失，可安排到多个时间点
  if (dayTodos.length) {
    html += `<div class="day-unscheduled-title" style="margin-top:0">${t('day_pool')} · ${t('day_drag_hint')}</div>`;
    html += '<div class="day-unscheduled-list">';
    html += dayTodos.map(t => ttItemHtml(t)).join('');
    html += '</div>';
  }

  html += `<div class="day-timetable" id="dayTimetable">`;
  // 渲染 24 行空的小时格（作为拖拽目标和时间轴背景）
  for (let h = 0; h < 24; h++) {
    const hh = String(h).padStart(2, '0');
    const nowCls = isToday && h === now.getHours() ? ' now' : '';
    html += `<div class="hour-row${nowCls}" data-hour="${h}">
      <div class="hour-label">${hh}:00</div>
      <div class="hour-todos" data-hour="${h}"></div>
    </div>`;
  }
  // 每个待办的每个时间段渲染为一个绝对定位事件条，实现跨时段显示
  dayTodos.forEach(todo => {
    parseTodoSlots(todo).forEach((slot, idx) => {
      const [h, m] = slot.start.split(':').map(Number);
      const top = (h * 60 + m) * PX_PER_MIN;
      const dur = slot.dur || todo.duration || 30;
      const height = Math.max(22, dur * PX_PER_MIN - 2);
      const style = `top:${top}px;height:${height}px;`;
      html += ttItemHtml(todo, style, slot, idx);
    });
  });
  // 今天的当前时间指示线
  if (isToday) {
    const nowTop = (now.getHours() * 60 + now.getMinutes()) * PX_PER_MIN;
    html += `<div class="now-line" style="top:${nowTop}px"></div>`;
  }
  html += '</div>';

  list.innerHTML = html;
}
// 单条待办 HTML（可拖动）
// 源模式：slot 为空 → 上方待办区，✕ 从当日移除整个待办
// 事件条模式：传 slot + slotIdx → 时间表上，显示该段时间，✕ 仅删除该时间段
function ttItemHtml(todo, style, slot, slotIdx) {
  // 用待办颜色生成事件条主题色（左边框 + 淡色渐变背景）
  const c = /^#[0-9a-fA-F]{6}$/.test(todo.color || '') ? todo.color : '#22d3ee';
  const colorVars = `--tc:${c};--tc-bg:${c}2e;`;
  const styleAttr = ` style="${colorVars}${style || ''}"`;
  // 事件条显示该段时间；源模式显示已安排段数，提示可继续拖放
  let timeText;
  if (slot) {
    timeText = `⏰ ${slot.start}~${addMinutes(slot.start, slot.dur || todo.duration || 30)}`;
  } else {
    const n = parseTodoSlots(todo).length;
    timeText = n ? `🕒 ${t('slot_count', { n })}` : `🕒 ${t('slot_none')}`;
  }
  const delBtn = slot
    ? `<button type="button" class="tt-del" data-act="del-slot" data-slot-idx="${slotIdx}" aria-label="remove">✕</button>`
    : `<button type="button" class="tt-del" data-act="del-day" aria-label="remove">✕</button>`;
  const slotAttr = slot ? ` data-slot-idx="${slotIdx}"` : '';
  return `<div class="tt-item ${todo.done ? 'done' : ''}" data-id="${todo.id}"${slotAttr} draggable="true"${styleAttr}>
    <span class="tt-drag-handle" title="拖动到小时格安排时间">⋮⋮</span>
    <input type="checkbox" ${todo.done ? 'checked disabled' : ''} data-act="toggle" class="tt-check">
    <span class="tt-time">${timeText}</span>
    <span class="tt-text" style="color:${todo.color || '#f5f5f7'}">${escapeHtml(todo.text)}</span>
    <span class="tt-time" style="min-width:auto">⏱${slot ? (slot.dur || todo.duration || 30) : (todo.duration || 30)}${t('unit_min')}</span>
    ${delBtn}
  </div>`;
}
// 从某日移除待办的某个时间段
function removeSlotFromTodo(todoId, slotIdx) {
  const t = state.todos.find(x => x.id === todoId);
  if (!t) return;
  t.slots = parseTodoSlots(t);
  if (slotIdx < 0 || slotIdx >= t.slots.length) return;
  t.slots.splice(slotIdx, 1);
  delete t.startTime;
  saveState();
  renderTodos();
  renderCalendar();
  renderDayModal();
}
// 从某日移除待办
function removeTodoFromDay(todoId) {
  const t = state.todos.find(x => x.id === todoId);
  if (!t) return;
  t.dates = (t.dates || []).filter(d => d !== currentDayDate);
  if (t.dates.length === 0) {
    if (t.done) {
      state.totalFocusCount = Math.max(0, (state.totalFocusCount || 0) - 1);
      $('#totalFocusCount').textContent = state.totalFocusCount;
    }
    state.todos = state.todos.filter(x => x.id !== todoId);
  }
  saveState();
  renderTodos();
  renderCalendar();
  renderDayModal();
}
function addTodoFromDayModal() {

  if (!text || !currentDayDate) return;

    slots: [],

// 拖拽：待办 → 日历日期 / 小时格
let draggedTodoId = null;
let timeSetTodoId = null;
let endTimeManuallyEdited = false; // 用户是否手动修改过结束时间

// 打开时间设置弹窗（拖到小时格时调用）
function openTimeSetModal(todo, dropHour) {
  timeSetTodoId = todo.id;
  endTimeManuallyEdited = false;
  $('#timeSetTodo').textContent = todo.text;
  // 默认开始时间：拖入的小时整点
  const defaultStart = `${String(dropHour).padStart(2, '0')}:00`;
  $('#timeSetStart').value = defaultStart;
  // 默认结束时间：开始 + duration
  const dur = todo.duration || 30;
  $('#timeSetEnd').value = addMinutes(defaultStart, dur);
  $('#timeSetMask').classList.add('show');
}

// 开始时间改变时，若用户未手动改过结束时间，则自动按 duration 推算结束时间
function onTimeSetStartChange() {
  if (endTimeManuallyEdited) return;
  const todo = state.todos.find(t => t.id === timeSetTodoId);
  const start = $('#timeSetStart').value;
  if (!todo || !start) return;
  $('#timeSetEnd').value = addMinutes(start, todo.duration || 30);
}

// 保存时间设置
function saveTimeSet() {
  const todo = state.todos.find(t => t.id === timeSetTodoId);
  if (!todo) { toast(t('time_set_error')); return; }
  const start = $('#timeSetStart').value;
  const end = $('#timeSetEnd').value;
  if (!start || !end) { toast(t('time_set_error')); return; }
  // 解析时间为分钟数（兼容 HH:MM 格式）
  const parseMin = (s) => {
    const m = /^(\d{1,2}):(\d{2})$/.exec(s);
    if (!m) return NaN;
    const h = parseInt(m[1], 10), min = parseInt(m[2], 10);
    if (h < 0 || h > 23 || min < 0 || min > 59) return NaN;
    return h * 60 + min;
  };
  const startMin = parseMin(start);
  const endMin = parseMin(end);
  if (isNaN(startMin) || isNaN(endMin)) { toast(t('time_set_error')); return; }
  const durMin = endMin - startMin;
  if (durMin <= 0) { toast(t('time_set_order')); return; }
  // 不允许安排当前时间之前的时间段（日期取当前日历详情的日期，按今年计算）
  const [sh, sm] = start.split(':').map(Number);
  const now = new Date();
  const [pm, pd] = (currentDayDate || achTodayMMDD()).split('-').map(Number);
  const startDt = new Date(now.getFullYear(), pm - 1, pd, sh, sm, 0, 0);
  if (startDt < now) { toast(t('time_set_past')); return; }
  // 追加一个时间段（同一待办可安排到多个时间点），不覆盖已有安排
  todo.slots = parseTodoSlots(todo);
  todo.slots.push({ start, dur: durMin });
  delete todo.startTime;
  // 若待办未安排在当天，自动加入当天
  todo.dates = todo.dates || [];
  if (currentDayDate && !todo.dates.includes(currentDayDate)) {
    todo.dates.push(currentDayDate);
  }
  saveState();
  renderTodos();
  renderCalendar();
  if (currentDayDate) renderDayModal();
  closeTimeSetModal();
  toast(t('time_set_done'));
  // 安排时间段可能解锁规划类成就（首个安排、累计安排、当日安排、多日期），需立即检测
  checkAchievements();
}

function closeTimeSetModal() {
  $('#timeSetMask').classList.remove('show');
  timeSetTodoId = null;
}

// 判断 MM-DD 日期（按今年）是否早于今天
function isPastDate(mmdd) {
  const now = new Date();
  const [m, d] = String(mmdd).split('-').map(Number);
  if (!m || !d) return false;
  return new Date(now.getFullYear(), m - 1, d) < new Date(now.getFullYear(), now.getMonth(), now.getDate());
}

function bindDragDrop() {
  document.addEventListener('dragstart', (e) => {
    const item = e.target.closest('.todo-item') || e.target.closest('.tt-item');
    if (item) {
      draggedTodoId = item.dataset.id;
      e.dataTransfer.effectAllowed = 'move';
    }
  });
  document.addEventListener('dragover', (e) => {
    if (e.target.closest('.cal-day') || e.target.closest('.hour-todos')) {
      e.preventDefault(); e.dataTransfer.dropEffect = 'move';
    }
  });
  document.addEventListener('dragenter', (e) => {
    const day = e.target.closest('.cal-day');
    if (day) day.classList.add('drag-over');
    const hour = e.target.closest('.hour-todos');
    if (hour) hour.classList.add('drag-over');
  });
  document.addEventListener('dragleave', (e) => {
    const day = e.target.closest('.cal-day');
    if (day && !day.contains(e.relatedTarget)) day.classList.remove('drag-over');
    const hour = e.target.closest('.hour-todos');
    if (hour && !hour.contains(e.relatedTarget)) hour.classList.remove('drag-over');
  });
  // 拖拽结束：清除所有残留的 drag-over 样式
  document.addEventListener('dragend', () => {
    document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
    draggedTodoId = null;
  });
  document.addEventListener('drop', (e) => {
    // 拖到日历日期格
    const day = e.target.closest('.cal-day');
    if (day && draggedTodoId) {
      e.preventDefault();
      day.classList.remove('drag-over');
      const date = day.dataset.date;
      const todo = state.todos.find(t => t.id === draggedTodoId);
      if (todo && date) {
        todo.dates = todo.dates || [];
        const idx = todo.dates.indexOf(date);
        if (idx >= 0) todo.dates.splice(idx, 1);
        else if (isPastDate(date)) { toast(t('drag_past_date')); draggedTodoId = null; return; }
        else todo.dates.push(date);
        saveState(); renderTodos(); renderCalendar();
      }
      draggedTodoId = null;
      return;
    }
    // 拖到日详情的小时格 → 弹出时间设置弹窗，由用户指定开始~结束时间
    const hour = e.target.closest('.hour-todos');
    if (hour && draggedTodoId) {
      e.preventDefault();
      hour.classList.remove('drag-over');
      const h = parseInt(hour.dataset.hour, 10);
      const todo = state.todos.find(t => t.id === draggedTodoId);
      // 过去的日期不允许拖入安排时间
      if (currentDayDate && isPastDate(currentDayDate)) {
        toast(t('drag_past_date'));
      } else if (todo && !isNaN(h)) {
        openTimeSetModal(todo, h);
      }
      draggedTodoId = null;
    }
  });
}
