// ============ 成就统计辅助 ============
// 今天（本地）的日期键 YYYY-MM-DD，以及日历用的 MM-DD
function achTodayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function achTodayMMDD() {
  const d = new Date();
  return `${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function parseDayKey(k) {
  const [y, m, d] = k.split('-').map(Number);
  return new Date(y, m - 1, d);
}
// 完成待办数
function achDoneTodos() { return state.todos.filter(x => x.done).length; }
// 完成的高优先级待办数
function achDoneHighTodos() { return state.todos.filter(x => x.done && x.importance === 'high').length; }
// 累计已安排的时间段总数
function achTotalSlots() { return state.todos.reduce((n, t) => n + parseTodoSlots(t).length, 0); }
// 已安排到日历的不同日期数
function achUniqueDates() {
  const s = new Set();
  state.todos.forEach(t => (t.dates || []).forEach(d => s.add(d)));
  return s.size;
}
// 任意单日安排了时间段的最大待办数（「井井有条」按历史任意一天统计，而非仅限今天）
function achBestPlannedDay() {
  const counts = {};
  state.todos.forEach(t => {
    if (parseTodoSlots(t).length === 0) return;
    (t.dates || []).forEach(d => { counts[d] = (counts[d] || 0) + 1; });
  });
  return Object.keys(counts).reduce((m, d) => Math.max(m, counts[d]), 0);
}
function achDay(key) { return (state.dayStats && state.dayStats[key]) || { focus: 0, minutes: 0, hours: [], todosDone: 0 }; }
// 记录一次专注完成，写入按日统计并更新最长连续天数
function recordFocusCompletion(minutes) {
  const key = achTodayKey();
  if (!state.dayStats) state.dayStats = {};
  const ds = state.dayStats[key] || (state.dayStats[key] = { focus: 0, minutes: 0, hours: [], todosDone: 0 });
  if (!Array.isArray(ds.hours)) ds.hours = [];
  ds.focus += 1;
  ds.minutes += minutes;
  ds.hours.push(new Date().getHours());
  // 重算最长连续专注天数（跨天连续，以有专注的日期为一环）
  const days = Object.keys(state.dayStats).filter(k => (state.dayStats[k].focus || 0) > 0).sort();
  let best = 0, cur = 0, prev = null;
  for (const k of days) {
    if (prev) {
      const gap = Math.round((parseDayKey(k) - parseDayKey(prev)) / 86400000);
      cur = gap === 1 ? cur + 1 : 1;
    } else cur = 1;
    if (cur > best) best = cur;
    prev = k;
  }
  state.bestStreak = Math.max(state.bestStreak || 0, best);
}
// 记录一个待办被标记完成
function recordTodoDone() {
  const key = achTodayKey();
  if (!state.dayStats) state.dayStats = {};
  const ds = state.dayStats[key] || (state.dayStats[key] = { focus: 0, minutes: 0, hours: [], todosDone: 0 });
  ds.todosDone = (ds.todosDone || 0) + 1;
}
// 判定：是否曾在 8 点前完成专注 / 0-4 点完成专注 / 同一天中午与晚上都在专注
function achEarlyBird() {
  return Object.values(state.dayStats || {}).some(d => (d.hours || []).some(h => h < 8)) ? 1 : 0;
}
function achNightOwl() {
  return Object.values(state.dayStats || {}).some(d => (d.hours || []).some(h => h < 4)) ? 1 : 0;
}
function achNoRest() {
  return Object.values(state.dayStats || {}).some(d => {
    const hours = d.hours || [];
    return hours.some(h => h >= 11 && h < 14) && hours.some(h => h >= 18 && h < 23);
  }) ? 1 : 0;
}

function isAchUnlocked(id) {
  return (state.unlockedAchievements || []).includes(id);
}

// 检测并解锁达标的成就，返回本次新解锁的成就列表
function checkAchievements() {
  const newly = [];
  ACHIEVEMENTS.forEach(a => {
    if (isAchUnlocked(a.id)) return;
    let val = 0;
    try { val = a.get() || 0; } catch (e) { val = 0; }
    if (val >= a.goal) {
      state.unlockedAchievements.push(a.id);
      newly.push(a);
    }
  });
  if (newly.length) {
    saveState();
    // 逐个弹出解锁提示（多个成就同时解锁时排队展示）
    newly.forEach(a => showAchievementPopup(a));
  }
  // 无论是否有新解锁，都刷新成就面板，保证进度数字/进度条实时更新
  renderAchievements();
  return newly;
}

/* ---- 成就解锁弹窗（支持多个排队） ---- */
let _achQueue = [];      // 待展示的成就
let _achShowing = false; // 是否正在展示

function showAchievementPopup(ach) {
  _achQueue.push(ach);
  _achShowNext();
}

function _achShowNext() {
  if (_achShowing || !_achQueue.length) return;
  _achShowing = true;
  const ach = _achQueue.shift();
  $('#achPopIcon').textContent = ach.icon;
  $('#achPopName').textContent = t(ach.nameKey);
  $('#achPopDesc').textContent = t(ach.descKey);
  const mask = $('#achPopMask');
  // 重置动画：先移除再强制回流，保证连续弹出时动画重播
  mask.classList.remove('show');
  void mask.offsetWidth;
  mask.classList.add('show');
  beep();
  clearTimeout(_achPopTimer);
  // 自动关闭（4 秒），也可点击按钮/遮罩提前关闭
  _achPopTimer = setTimeout(_achClose, 4000);
}

let _achPopTimer = null;

function _achClose() {
  clearTimeout(_achPopTimer);
  $('#achPopMask').classList.remove('show');
  _achShowing = false;
  // 若无遮罩关闭动画，立即处理下一个（稍作延迟避免视觉重叠）
  setTimeout(_achShowNext, 260);
}

function renderAchievements() {
  const grid = $('#achGrid');
  if (!grid) return;
  if (!ACHIEVEMENTS.length) {
    grid.innerHTML = `<div class="ach-empty">${t('ach_empty')}</div>`;
    $('#achProgress').textContent = '';
    return;
  }
  const unlocked = ACHIEVEMENTS.filter(a => isAchUnlocked(a.id)).length;
  $('#achProgress').textContent = t('ach_progress', { n: unlocked, total: ACHIEVEMENTS.length });

  grid.innerHTML = ACHIEVEMENTS.map(a => {
    const ok = isAchUnlocked(a.id);
    // 已解锁的成就不再计数：进度冻结在完成态（goal/goal），不受后续统计变化影响
    const val = ok ? a.goal : Math.max(0, a.get() || 0);
    const pct = Math.min(100, Math.round(val / a.goal * 100));
    // 彩蛋成就：未解锁时隐藏真实内容，只显示神秘卡片
    const eggHidden = a.egg && !ok;
    const icon = eggHidden ? '❓' : a.icon;
    const name = eggHidden ? t('ach_egg_locked') : t(a.nameKey);
    const desc = eggHidden ? t('ach_egg_locked_desc') : t(a.descKey);
    return `<div class="ach-item ${ok ? 'unlocked' : 'locked'} ${a.egg ? 'egg' : ''}" title="${escapeHtml(desc)}">
      ${ok ? `<span class="ach-badge">${a.egg ? '🥚' : '✦'}</span>` : ''}
      <div class="ach-icon">${icon}</div>
      <div class="ach-name">${escapeHtml(name)}</div>
      <div class="ach-desc">${escapeHtml(desc)}</div>
      <div class="ach-bar"><div class="ach-bar-fill" style="width:${pct}%"></div></div>
      <div class="ach-bar-text">${eggHidden ? '???' : Math.min(val, a.goal) + ' / ' + a.goal}</div>
    </div>`;
  }).join('');
}

============================================================ */
function bindEvents() {
  // 模式切换
  document.querySelectorAll('.mode-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      state.mode = tab.dataset.mode;
      state.isRunning = false;
      state.endTime = null;
      state.remainingMs = modeDuration();
      state.activeTodoId = null;
      $('#startBtn').textContent = t('btn_start');
      applyModeColor();
      renderModeTabs();
      renderTimer();
      saveState();
    });
  });

  // 控制按钮
  $('#startBtn').addEventListener('click', () => state.isRunning ? pause() : start());
  $('#resetBtn').addEventListener('click', reset);
  $('#skipBtn').addEventListener('click', skip);
  $('#resetRoundBtn').addEventListener('click', resetRound);

  // 时长设置
  ['focusMin', 'shortMin', 'longMin', 'longInterval'].forEach(id => {
    $('#' + id).addEventListener('change', (e) => {
      const v = Math.max(1, parseInt(e.target.value) || 1);
      e.target.value = v;
      if (id === 'longInterval') state.longInterval = v;
      else state[id] = v;
      // 若当前未运行，刷新显示时长
      if (!state.isRunning) {
        state.remainingMs = modeDuration();
        renderTimer();
      }
      saveState();
    });
  });

  // 推荐搭配
  $('#presets').addEventListener('click', (e) => {
    const btn = e.target.closest('.preset');
    if (!btn) return;
    const combo = COMBOS.find(c => c.key === btn.dataset.combo);
    if (!combo) return;
    state.focusMin = combo.focus;
    state.shortMin = combo.short;
    state.longMin = combo.long;
    state.longInterval = combo.interval;
    renderSettings();
    if (!state.isRunning) {
      state.remainingMs = modeDuration();
      renderTimer();
    }
    saveState();
    toast(`已应用「${combo.name}」`);
  });

  // 环境音
  $('#audioList').addEventListener('click', (e) => {
    const chip = e.target.closest('.audio-chip');
    if (!chip) return;
    toggleTrack(chip.dataset.track);
  });
  // 音频模式切换：选择为哪个模式配置音轨
  document.querySelectorAll('.audio-mode-btn').forEach(b => {
    b.addEventListener('click', () => {
      state.audioEditMode = b.dataset.audioMode;
      renderAudioList();
    });
  });
  // 播放模式切换（循环/随机/顺序），按当前 audioEditMode 设置
  document.querySelectorAll('.play-mode-btn').forEach(b => {
    b.addEventListener('click', () => {
      const mode = state.audioEditMode;
      state.playModeByMode[mode] = b.dataset.playMode;
      state.playIndexByMode[mode] = 0;
      saveState();
      renderAudioList();
      // 若当前正在运行该模式，立即应用新的播放模式
      if (state.isRunning && state.mode === mode) {
        const el = getAudioEl();
        el.loop = (b.dataset.playMode === 'loop');
      }
    });
  });
  $('#volume').addEventListener('input', (e) => {
    state.volume = e.target.value / 100;
    if (audioEl) audioEl.volume = state.volume;
    saveState();
  });
  $('#fileInput').addEventListener('change', (e) => {
    const files = Array.from(e.target.files || []);
    files.forEach(f => {
      const url = URL.createObjectURL(f);
      const id = 'custom-' + Date.now() + '-' + Math.random().toString(36).slice(2, 5);
      state.customTracks.push({ id, name: f.name.replace(/\.[^.]+$/, ''), url });
    });
    renderAudioList();
  });

  // 待办
  $('#todoToggle').addEventListener('click', () => {
    const form = $('#todoForm');
    const btn = $('#todoToggle');
    form.hidden = !form.hidden;
    btn.classList.toggle('open', !form.hidden);
    btn.textContent = form.hidden ? '+' : '−';
  });
  // 多日期选择（选择月/日自动添加，chips 上点 ✕ 删除）
  $('#dateChips').addEventListener('click', (e) => {
    const rm = e.target.closest('[data-rm-date]');
    if (!rm) return;
    const dt = rm.dataset.rmDate;
    formDates = formDates.filter(x => x !== dt);
    renderDateChips();
  });
  $('#todoForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const text = $('#todoText').value.trim();
    if (!text) return;
    const duration = Math.max(1, parseInt($('#todoDuration').value) || 30);
    const importance = $('#todoImp').value;
    const color = $('#todoColor').value;
    const dates = [...formDates];
    addTodo(text, duration, importance, color, dates);
    $('#todoText').value = '';
    $('#todoDuration').value = '30';
    formDates = [];
    renderDateChips();
  });
  $('#todoList').addEventListener('click', (e) => {
    const item = e.target.closest('.todo-item');
    if (!item) return;
    const id = item.dataset.id;
    const act = e.target.dataset.act;
    if (act === 'del') delTodo(id);
    else if (act === 'toggle') toggleTodo(id);
  });
  $('#todoList').addEventListener('change', (e) => {
    if (e.target.dataset.act === 'toggle') {
      toggleTodo(e.target.closest('.todo-item').dataset.id);
    }
  });

  // 日详情弹窗内的勾选
  $('#dayModalList').addEventListener('change', (e) => {
    if (e.target.dataset.act === 'toggle') {
      const id = e.target.closest('[data-id]').dataset.id;
      toggleTodo(id);
      renderDayModal();
    }
  });
  $('#dayModalList').addEventListener('click', (e) => {
    const delDayBtn = e.target.closest('[data-act="del-day"]');
    if (delDayBtn) {
      const id = delDayBtn.closest('[data-id]').dataset.id;
      removeTodoFromDay(id);
      return;
    }
    const delSlotBtn = e.target.closest('[data-act="del-slot"]');
    if (delSlotBtn) {
      const id = delSlotBtn.closest('[data-id]').dataset.id;
      removeSlotFromTodo(id, parseInt(delSlotBtn.dataset.slotIdx, 10));
    }
  });

  document.querySelectorAll('.lang-btn[data-lang]').forEach(b => {
    b.addEventListener('click', () => setLang(b.dataset.lang));
  });

  // 页面风格切换
  document.querySelectorAll('.theme-btn').forEach(b => {
    b.addEventListener('click', () => setTheme(b.dataset.theme));
  });

  // 成就解锁弹窗：点击按钮或遮罩关闭
  $('#achPopBtn').addEventListener('click', _achClose);
  $('#achPopMask').addEventListener('click', (e) => {
    if (e.target === $('#achPopMask')) _achClose();
  });

  // 日历导航
  $('#calPrev').addEventListener('click', calPrev);
  $('#calNext').addEventListener('click', calNext);

  // 日历格点击 → 打开当天详情
  $('#calGrid').addEventListener('click', (e) => {
    const day = e.target.closest('.cal-day');
    if (!day || day.classList.contains('other')) return;
    // 过去的日期不允许打开日详情：随机彩蛋文案 + 紫色提示，集齐三条文案解锁彩蛋成就
    if (isPastDate(day.dataset.date)) {
      const msgKeys = ['past_msg_1', 'past_msg_2', 'past_msg_3'];
      const key = msgKeys[Math.floor(Math.random() * msgKeys.length)];
      toast(t(key), 'toast-nostalgic');
      state.pastMsgSeen = state.pastMsgSeen || [];
      if (!state.pastMsgSeen.includes(key)) {
        state.pastMsgSeen.push(key);
        saveState();
        checkAchievements();

    renderTimer();

    pendingReminderTodo = null;
    $('#reminderMask').classList.remove('show');
  });
  $('#reminderMask').addEventListener('click', (e) => {
    if (e.target.id === 'reminderMask') {
      pendingReminderTodo = null;
      $('#reminderMask').classList.remove('show');
    }
  });

  // 时间设置弹窗
  $('#timeSetSave').addEventListener('click', saveTimeSet);
  $('#timeSetCancel').addEventListener('click', closeTimeSetModal);
  $('#timeSetMask').addEventListener('click', (e) => {
    if (e.target.id === 'timeSetMask') closeTimeSetModal();
  });
  // 回车保存
  $('#timeSetStart').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') saveTimeSet();
  });
  $('#timeSetEnd').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') saveTimeSet();
  });
  // 开始时间改变 → 自动推算结束时间（除非用户已手动改结束时间）
  $('#timeSetStart').addEventListener('change', onTimeSetStartChange);
  $('#timeSetStart').addEventListener('input', onTimeSetStartChange);
  // 用户手动修改结束时间 → 标记，不再被自动覆盖
  $('#timeSetEnd').addEventListener('change', () => { endTimeManuallyEdited = true; });
  $('#timeSetEnd').addEventListener('input', () => { endTimeManuallyEdited = true; });

  // 拖拽
  bindDragDrop();
}

/* ============================================================
   滚动渐显动画（IntersectionObserver）
============================================================ */
function initReveal() {
  const els = document.querySelectorAll('[data-reveal]');
  if (!('IntersectionObserver' in window)) {
    els.forEach(el => el.classList.add('in'));
    return;
  }
  const io = new IntersectionObserver((entries) => {
    entries.forEach(en => {
      if (en.isIntersecting) {
        en.target.classList.add('in');
        io.unobserve(en.target);
      }
    });
  }, { threshold: 0.12, rootMargin: '0px 0px -30px 0px' });
  els.forEach(el => io.observe(el));
}

/* ============================================================
   启动
============================================================ */
function init() {
  loadState();
  applyLang();
  initDatePicker();
  document.querySelectorAll('.lang-btn[data-lang]').forEach(b =>
    b.classList.toggle('active', b.dataset.lang === currentLang));
  setTheme(localStorage.getItem('jtd_theme') || 'dark');
  renderSettings();
  renderPresets();
  renderAudioList();
  renderTodos();
  renderCalendar();
  renderAchievements();
  renderAll();
  bindEvents();
  initReveal();
  // 启动时按当前进度补发已达标成就（刷新/日期间隔后自动同步）
  checkAchievements();

  // 待办提醒：每 30 秒检查一次
  checkReminders();
  setInterval(checkReminders, 30 * 1000);
  // 首次用户交互时请求桌面通知权限
  document.addEventListener('click', askNotificationPermission, { once: true });

  // 若恢复运行，启动 tick
  if (state.isRunning) {
    $('#startBtn').textContent = t('btn_pause');
    startTick();
    playModePlaylist(state.mode);
  }
}
init();
</script>
